<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Append "Symbols Nerd Font" as a last-resort fallback so Nerd Font / legacy
  Font Awesome PUA glyphs (e.g. U+f544, U+f55c) still render in every app.
  Needed since the fontconfig 2.18 upgrade started preferring the Nerd Fonts v3
  packages, which relocated those old codepoints out of the text fonts.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font</string></edit>
  </match>
</fontconfig>
