# nvim-remote opens files with --remote-tab, leaving extra tabs behind (:tabonly needed to quit).
# Inside nvim: hide the lazygit float and open in the current window instead; lazygit keeps running hidden.
os:
  editPreset: nvim-remote
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-expr "v:lua.vim.api.nvim_win_hide(0)" > /dev/null && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-expr "v:lua.vim.api.nvim_win_hide(0)" > /dev/null && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-expr "v:lua.vim.api.nvim_win_hide(0)" > /dev/null && nvim --server "$NVIM" --remote {{dir}})'
